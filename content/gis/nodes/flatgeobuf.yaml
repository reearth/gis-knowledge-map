id: flatgeobuf
title: FlatGeobuf
aliases: [FGB]

type: data-formats
parentNode: data-formats-group
difficulty: intermediate
importance: useful

summary: A performant binary format for geographic data with a spatial index optimized for fast streaming.
description: |
  FlatGeobuf is a binary encoding format for geographic data that uses FlatBuffers for serialization.
  It features a packed Hilbert R-tree spatial index, enabling efficient spatial filtering and streaming.

  FlatGeobuf is designed for HTTP range request scenarios, making it ideal for cloud-native applications
  where you need to query and render only a specific geographic area without downloading the entire dataset.
  It's significantly faster than GeoJSON for large datasets while remaining relatively compact.

