# ============================================
# OFFICIAL NODE TEMPLATE FOR GIS KNOWLEDGE MAP
# ============================================
# Use this template when creating new nodes.
# Follow this structure EXACTLY to avoid validation errors.
# ============================================

# REQUIRED FIELDS (all must be present)
id: example-node-id                    # kebab-case, unique identifier
title: Example Node Title              # Human-readable title
aliases: []                            # Array of alternative names (can be empty)

# Node classification
type: core-concepts                    # MUST be one of the 13 defined types (see below)
parentNode: core-concepts-group        # Parent group this node belongs to
difficulty: beginner                   # beginner | intermediate | advanced
importance: critical                   # nice-to-know | useful | important | critical

# Content (BOTH required)
summary: A concise one-sentence description of this node (under 150 characters).
description: |
  A detailed multi-paragraph description of this concept, tool, or technology.

  Use multiple paragraphs to explain:
  - What it is
  - Why it matters
  - Key use cases
  - Technical details

# Visual styling (REQUIRED as nested object)
style:
  color: "#64748B"                     # Hex color for this node type
  icon: "circle"                       # Lucide icon name (without 'Icon' suffix)

# Relationships (OPTIONAL but recommended)
# Structure: object with arrays of node IDs
relationships:
  prerequisites:                       # Nodes that should be learned first
    - prerequisite-node-id
  related:                            # Related/similar nodes
    - related-node-id
  enables:                            # Nodes this enables/unlocks
    - enabled-node-id
  usedBy:                             # Tools/nodes that use this
    - user-node-id
  partOf:                             # Larger concept this is part of
    - parent-concept-id
  basedOn:                            # Nodes this is built upon
    - foundation-node-id

# Metadata
tags:                                  # Array of keyword tags
  - tag1
  - tag2
  - tag3

keywords:                              # Array of search keywords
  - keyword1
  - keyword2
  - keyword3

# Role relevance scores (0.0 to 1.0)
roleRelevance:
  gis-analyst: 0.8
  gis-developer: 1.0
  cartographer: 0.7
  data-engineer: 0.9

# External resources (MUST be array, not object)
resources:
  - title: "Official Documentation"
    url: "https://example.com/docs"
    type: documentation               # MUST be: reference | tutorial | documentation | video | tool
  - title: "Tutorial Guide"
    url: "https://example.com/tutorial"
    type: tutorial
  - title: "API Reference"
    url: "https://example.com/api"
    type: reference

# Metadata
lastUpdated: "2026-04-07"             # ISO date format

