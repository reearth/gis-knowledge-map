summary: A JavaScript library for interactive, customizable vector maps using WebGL.
description: |
  Mapbox GL JS is a JavaScript library for vector maps on the Web. It uses WebGL to
  render interactive maps from vector tiles and Mapbox styles. It's part of the
  Mapbox GL ecosystem for building mapping applications.


