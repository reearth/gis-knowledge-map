practicalExercises:
  - Calculate the UTM zone for your city or project area
  - Convert lat/lon coordinates to UTM using GDAL or online tools
  - Measure accurate distances using UTM coordinates
  - Compare distortion between adjacent UTM zones
  - Handle datasets spanning multiple UTM zones

commonMistakes:
  - Using wrong UTM zone for the area of interest
  - Not specifying northern vs southern hemisphere
  - Mixing coordinates from different UTM zones
  - Using UTM for areas spanning multiple zones without reprojection
  - Confusing UTM with MGRS (Military Grid Reference System)
  - Applying UTM in polar regions (>84°N or >80°S)

realWorldApplications:
  - Topographic and cadastral mapping worldwide
  - GPS navigation and military operations (MGRS based on UTM)
  - Engineering projects requiring metric precision
  - Environmental monitoring and natural resource management
  - Archaeological site mapping and excavation grids

advancedTopics:
  - UTM zone overlap and transitional zones
  - Scale factor variation within zones
  - UTM in different datum contexts (WGS84-UTM vs NAD83-UTM)
  - Custom transverse Mercator projections vs standard UTM
  - Polar stereographic alternatives for polar regions

technicalDetails:
  zoneWidth: "6 degrees longitude"
  zones: "60 (numbered 1-60 from 180°W eastward)"
  latitudeBands: "C-X (excluding I and O), 8° each"
  falseEasting: "500,000 meters"
  falseNorthing: "0m (Northern), 10,000,000m (Southern)"
  scaleFactor: "0.9996 at central meridian"
  coverage: "84°N to 80°S"

