id: turf
title: Turf.js
aliases: [Turf, TurfJS]

type: analysis-libraries
parentNode: analysis-libraries-group
difficulty: intermediate
importance: critical

summary: A JavaScript library for spatial analysis that works in the browser and Node.js with GeoJSON data.
description: |
  Turf.js is a modular geospatial analysis library that performs spatial operations in JavaScript.
  It provides tools for measurement, transformation, classification, interpolation, and more.

  Works entirely with GeoJSON, runs in browser and Node.js, and includes 100+ spatial operations
  like buffer, union, intersection, distance calculations, and statistical analysis.

