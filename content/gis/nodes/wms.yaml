id: wms
title: WMS
aliases: [Web Map Service, OGC WMS]

type: gis-servers-services
parentNode: gis-servers-services-group
difficulty: intermediate
importance: critical

summary: OGC standard for serving georeferenced map images over HTTP (PNG, JPEG, GIF).
description: |
  Web Map Service (WMS) is an OGC standard protocol for requesting georeferenced map images
  from a server. The server generates maps dynamically from spatial data, returning rendered
  images in formats like PNG or JPEG.

  Supports GetMap (retrieve map image), GetCapabilities (service metadata), and GetFeatureInfo
  (query features). Clients specify bounding box, projection, layers, and styling. Widely
  supported by GeoServer, MapServer, QGIS, and web mapping libraries.

