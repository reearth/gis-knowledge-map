summary: ESRI's commercial GIS server platform for publishing maps, data, and analytical tools as web services.
description: |
  ArcGIS Server is ESRI's enterprise-grade server software for publishing and managing
  GIS services. Part of ArcGIS Enterprise, it provides comprehensive capabilities for
  web mapping, spatial analysis, and data management.

  Supports map services, feature services, image services, geoprocessing services, and
  OGC standards (WMS, WFS, WCS, WMTS). Integrates tightly with ArcGIS Pro and ArcGIS Online.
  Scalable, secure, and includes advanced capabilities like distributed analysis and caching.

