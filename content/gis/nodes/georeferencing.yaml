summary: The process of aligning imagery, scanned maps, or other spatial data to real-world coordinates by establishing the relationship between image coordinates and ground coordinates.
description: |
  The process of aligning imagery, scanned maps, or other spatial data to real-world coordinates by establishing the relationship between image coordinates and ground coordinates. This involves identifying control points and applying geometric transformations to position data accurately in geographic space.

