summary: JSON schema for describing time-dynamic 3D scenes for Cesium virtual globe.
description: |
  CZML (Cesium Language) is a JSON schema for describing time-dynamic graphical scenes, primarily
  for display in Cesium. It describes objects like points, lines, polygons, models, and their
  properties over time.

  CZML supports interpolation of positions and properties, making it ideal for visualizing moving
  objects (vehicles, satellites, aircraft), animated data, and temporal geographic phenomena.
  It can represent complex 4D (space + time) datasets in a compact, streamable format that's
  optimized for web-based 3D visualization.

