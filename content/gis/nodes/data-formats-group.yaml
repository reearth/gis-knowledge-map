aliases: [File Formats, Spatial Formats, GIS Formats]

type: data-formats
difficulty: intermediate
importance: critical
isGroup: true

summary: Standard file formats for storing and exchanging geospatial data.
description: |
  Data formats define how spatial information is structured and stored in files.
  Different formats serve different purposes - some optimize for interchange (GeoJSON, KML),
  others for analysis (Shapefile, GeoPackage), and some for specific use cases like
  cloud-optimized delivery (COG, FlatGeobuf). Choosing the right format impacts performance,
  compatibility, and functionality.

