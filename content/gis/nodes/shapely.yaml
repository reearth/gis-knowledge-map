summary: A Python library for manipulation and analysis of planar geometric objects (points, lines, polygons).
description: |
  Shapely is a Python package for geometric manipulation and analysis based on the GEOS library
  (the C++ port of JTS). It provides a Pythonic interface to geometric operations.

  Supports creation, validation, and manipulation of geometric objects following the OGC
  Simple Features specification. Includes operations like buffer, union, intersection,
  difference, and spatial predicates. Foundation library for GeoPandas and many Python GIS tools.

