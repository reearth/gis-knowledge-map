id: line
title: Line
aliases: []

type: data-models
parentNode: data-models-group
difficulty: beginner
importance: critical

summary: One-dimensional geometry representing linear features such as roads, rivers, pipelines, boundaries, or any feature with length but negligible width at map scale.
description: |
  A Line (also called LineString or Polyline) is a vector geometry type representing a connected
  sequence of points forming a continuous path. Lines are used to model linear features like
  roads, rivers, transmission lines, administrative boundaries, flight paths, or contour lines.

  Lines are defined by an ordered set of vertices (points), with straight segments connecting
  consecutive vertices. They have length and direction but no area. Lines can be simple (non-
  self-intersecting) or complex, and can represent both physical features and abstract concepts
  like boundaries or routes. MultiLineStrings allow representation of disconnected linear features
  as a single entity.

