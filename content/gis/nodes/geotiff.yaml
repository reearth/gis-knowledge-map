id: geotiff
title: GeoTIFF
aliases: [TIFF, Tagged Image File Format]

type: data-formats
parentNode: data-formats-group
difficulty: intermediate
importance: critical

summary: A georeferenced raster image format that embeds geographic metadata within TIFF files.
description: |
  GeoTIFF is a public domain metadata standard which allows georeferencing information to be embedded
  within a TIFF file. It's the industry standard for satellite imagery, aerial photography, and elevation models.

  Supports various data types, compression methods, and can store multi-band raster data.

