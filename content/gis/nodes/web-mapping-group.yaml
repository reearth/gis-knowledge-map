summary: JavaScript libraries for rendering interactive maps in web browsers.
description: |
  Web mapping libraries are client-side JavaScript frameworks that render interactive
  maps in web browsers. They handle map display, user interactions (pan/zoom), layer
  management, and often integrate with tile servers and geospatial APIs. Popular libraries
  include Leaflet (lightweight), OpenLayers (feature-rich), Mapbox GL JS (vector tiles),
  Cesium (3D), and deck.gl (large datasets with WebGL).

