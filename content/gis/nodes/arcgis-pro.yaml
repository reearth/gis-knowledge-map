summary: ESRI's modern 64-bit desktop GIS application with 2D/3D capabilities, replacing ArcMap.
description: |
  ArcGIS Pro is ESRI's flagship desktop GIS application, designed for professional mapping,
  spatial analysis, and data management. Built from the ground up as a 64-bit application
  with modern ribbon interface and native 3D support.

  Offers advanced cartography, geoprocessing, spatial analysis, 3D visualization, integration
  with ArcGIS Online/Enterprise, Python automation (arcpy), and ModelBuilder. Supports industry
  standard formats and provides comprehensive GIS workflows. Subscription-based licensing.

