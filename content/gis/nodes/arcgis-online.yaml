summary: ESRI's cloud-based GIS platform for creating, sharing, and analyzing maps and spatial data.
description: |
  ArcGIS Online is ESRI's Software-as-a-Service (SaaS) platform for web-based GIS,
  providing tools for mapping, analysis, data hosting, and collaboration without
  requiring server infrastructure.

  Includes web map creation, hosted feature/tile services, spatial analysis tools,
  Story Maps, dashboards, and sharing capabilities. Integrates with ArcGIS Pro and
  ArcGIS Enterprise. Subscription-based with tiered credits system. Popular for
  organizations needing cloud GIS without managing infrastructure.

