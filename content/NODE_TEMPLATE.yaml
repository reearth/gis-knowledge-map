# ============================================
# COMMON MISTAKES TO AVOID
# ============================================
# ❌ DON'T: Put icon and color at top level
# ✅ DO: Put them inside style: object
#
# ❌ DON'T: Use resources as nested object with categories
# ✅ DO: Use resources as flat array
#
# ❌ DON'T: Use invalid resource types like "article", "guide", "repository"
# ✅ DO: Use only: reference, tutorial, documentation, video, tool
#
# ❌ DON'T: Reference node IDs that don't exist
# ✅ DO: Only reference existing node IDs in relationships
#
# ❌ DON'T: Forget the summary field
# ✅ DO: Always include both summary AND description
#
# ❌ DON'T: Use mixed indentation (tabs + spaces)
# ✅ DO: Use consistent 2-space indentation throughout
