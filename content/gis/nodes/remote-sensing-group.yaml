id: remote-sensing-group
title: Remote Sensing
aliases: [Earth Observation, Satellite Imagery]

type: remote-sensing
difficulty: advanced
importance: important
isGroup: true

summary: The science of acquiring and analyzing information about Earth's surface using sensors on satellites or aircraft.
description: |
  Remote sensing involves obtaining information about objects or areas from a distance, typically
  from satellites or aircraft. It's used for environmental monitoring, land use mapping, disaster
  response, and many other applications. Combines imagery acquisition, image processing, and
  geospatial analysis to extract meaningful information from satellite and aerial imagery.
  Includes satellite imagery, aerial imagery, LiDAR, SAR, and processing techniques.

