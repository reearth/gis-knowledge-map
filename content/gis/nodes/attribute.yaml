summary: Non-spatial information associated with a geographic feature, stored in tabular format.
description: |
  Non-spatial information associated with a geographic feature, stored in tabular format. Attributes describe the characteristics, properties, or qualities of features, such as name, population, elevation, or classification. They enable queries, analysis, and thematic mapping.

