summary: The spatial component that defines the shape, location, and extent of geographic features using coordinate pairs.
description: |
  The spatial component that defines the shape, location, and extent of geographic features using coordinate pairs. Geometry types include points (0D), lines (1D), polygons (2D), and their multi-part variants. It provides the mathematical foundation for representing real-world objects in GIS.

