summary: A WebGL-powered framework for visual exploratory data analysis of large geospatial datasets in the browser.
description: |
  deck.gl is a GPU-powered framework for visual exploratory data analysis of large datasets.
  Built by Uber, it provides a suite of high-performance, WebGL-based visualization layers for
  rendering large-scale geospatial data.

  Features include: GPU-accelerated rendering, 50+ built-in layers (hexagon, arc, trips, etc.),
  React integration, and support for millions of data points with 60fps performance.

