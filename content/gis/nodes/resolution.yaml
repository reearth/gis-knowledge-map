id: resolution
title: Resolution
aliases: []

type: core-concepts
parentNode: core-concepts-group
difficulty: beginner
importance: important

summary: The level of detail or precision in spatial data, determining how much real-world detail can be captured and represented.
description: |
  The level of detail or precision in spatial data, determining how much real-world detail can be captured and represented. For raster data, resolution refers to cell size (e.g., 30m pixels). For vector data, it relates to coordinate precision and feature density. Higher resolution means more detail but larger file sizes.

