id: epsg-codes
title: EPSG Codes
aliases: []

type: spatial-reference-systems
parentNode: spatial-reference-systems-group
difficulty: intermediate
importance: important
estimatedTime: 30 minutes

summary: EPSG codes are standardized numeric identifiers for coordinate reference systems (CRS) maintained by the EPSG Geodetic Parameter Dataset.
description: >
  EPSG codes are standardized numeric identifiers for coordinate reference systems (CRS) maintained by the EPSG Geodetic Parameter Dataset. Each code uniquely identifies a specific combination of datum, coordinate system, and projection. Using EPSG codes ensures consistent spatial reference across GIS software and prevents ambiguity in geospatial data exchange. Common codes include EPSG:4326 (WGS84), EPSG:3857 (Web Mercator), and thousands of regional CRS.

style:
  color: "#10B981"
  icon: "hash"

topics:
  - EPSG database structure and maintenance
  - Common EPSG codes (4326, 3857, UTM zones)
  - EPSG code lookup and search
  - Geographic vs projected CRS codes
  - Deprecated and superseded codes
  - EPSG vs other identifiers (OGC URNs, PROJ strings, WKT)
  - Regional and national CRS codes

prerequisites:
