summary: SQL functions for spatial analysis, geometric operations, and raster processing in PostGIS databases.
description: |
  PostGIS provides hundreds of spatial functions for performing geometric calculations,
  spatial analysis, and raster processing directly in SQL. Functions are organized into
  categories: measurement, relationships, processing, and raster operations.

  Includes ST_Buffer, ST_Intersection, ST_Union, ST_Distance, ST_Contains, ST_Intersects,
  and many more. Supports both vector (geometry) and raster operations, 3D geometries,
  topology, and network routing. Enables powerful server-side spatial analysis.

