id: spatialite
title: SpatiaLite
aliases: [Spatial SQLite]

type: spatial-databases
parentNode: spatial-databases-group
difficulty: intermediate
importance: important

summary: SQLite extension adding spatial capabilities - a lightweight alternative to PostGIS for embedded applications.
description: |
  SpatiaLite extends SQLite with comprehensive spatial data support, providing a complete
  spatial database in a single file. Often described as "PostGIS for SQLite," it implements
  OGC standards and most PostGIS-like functions.

  Supports geometry types, spatial indexing (R-Tree), coordinate transformations, and
  hundreds of spatial functions. Perfect for mobile applications, embedded systems, and
  single-user desktop GIS. Used by QGIS, GDAL, and many mobile mapping apps. No server required.

