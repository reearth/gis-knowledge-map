summary: A JavaScript port of the Java Topology Suite (JTS) for geometric operations and spatial predicates.
description: |
  JSTS (JavaScript Topology Suite) is a JavaScript library of spatial predicates and functions
  for processing geometry. It's a port of the well-established Java Topology Suite (JTS).

  Provides robust geometric operations including buffer, union, intersection, difference,
  spatial predicates (contains, intersects, touches), and topology validation. Works with
  planar geometry and implements the OGC Simple Features Specification.

