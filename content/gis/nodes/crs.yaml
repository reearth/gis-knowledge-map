practicalExercises:
  - Identify the CRS of existing spatial datasets using QGIS or GDAL
  - Compare how the same location appears in different CRS
  - Fix a dataset with missing or incorrect CRS definition
  - Convert coordinates between geographic and projected systems

commonMistakes:
  - Assuming all datasets use the same CRS
  - Confusing CRS with file formats
  - Ignoring CRS metadata leading to misaligned layers
  - Using inappropriate CRS for the area of interest (e.g., global CRS for local data)

realWorldApplications:
  - GPS receivers outputting coordinates in different CRS
  - Web mapping applications standardizing on Web Mercator
  - National mapping agencies using country-specific CRS
  - Aviation and maritime navigation using specialized CRS

