summary: Uber's open-source geospatial analysis tool for visualizing and exploring large-scale location datasets.
description: |
  Kepler.gl is a powerful open-source geospatial analysis tool for large-scale datasets,
  originally developed by Uber's Visualization team. Provides a browser-based interface
  for creating rich, interactive visualizations without coding.

  Handles millions of points with GPU-accelerated rendering (deck.gl), supports various
  data formats (CSV, GeoJSON, KML), offers multiple visualization types (heatmaps, arcs,
  3D buildings, trips), and includes filtering, aggregation, and time-series animation.
  Available as web app, React component, or Jupyter widget.

