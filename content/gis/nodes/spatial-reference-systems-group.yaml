summary: Systems for defining how spatial data relates to locations on Earth's surface.
description: |
  Spatial Reference Systems (SRS) are essential for accurately positioning geographic data.
  They define how coordinates relate to real-world locations through coordinate reference systems,
  datums, and map projections. Understanding SRS is critical for proper spatial analysis,
  coordinate transformation, and integration of data from different sources.

