summary: Different ways to represent spatial features and phenomena in digital form.
description: |
  Data models define how geographic features and phenomena are represented in a GIS.
  The two primary models are vector (discrete features like points, lines, polygons) and
  raster (continuous fields in grids). Understanding these models is essential for choosing
  the right format, performing appropriate analyses, and optimizing data storage.

