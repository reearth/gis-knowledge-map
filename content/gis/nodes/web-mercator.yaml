  - Recognize Web Mercator's limitations and distortions
  - Convert between WGS84 (EPSG:4326) and Web Mercator (EPSG:3857)
  - Work with Web Mercator in mapping libraries (Leaflet, Mapbox, OpenLayers)
  - Know when NOT to use Web Mercator

