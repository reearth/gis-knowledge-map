id: aerial-imagery
title: Aerial Imagery
aliases: [Aerial Photography, Orthophotos, Drone Imagery]

type: remote-sensing
parentNode: remote-sensing-group
difficulty: beginner
importance: important

summary: High-resolution imagery from aircraft and drones for detailed mapping and surveying.
description: |
  Aerial imagery captures high-resolution photographs from aircraft or drones (UAVs),
  providing detailed views for mapping, surveying, planning, and monitoring at local scales.
  Much higher resolution than satellite imagery but limited geographic coverage.

  Aircraft imagery: typically 10-50cm resolution, flown by government/commercial providers
  (USGS, commercial surveyors). Drone imagery: 1-5cm resolution, on-demand, cost-effective
  for small areas. Requires orthorectification for accurate measurements. Used in urban
  planning, construction, agriculture, and asset inspection.

