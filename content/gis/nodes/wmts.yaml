id: wmts
title: WMTS
aliases: [Web Map Tile Service, OGC WMTS]

type: gis-servers-services
parentNode: gis-servers-services-group
difficulty: intermediate
importance: important

summary: OGC standard for serving pre-rendered or cached map tiles with fixed scale levels.
description: |
  Web Map Tile Service (WMTS) is an OGC standard for serving pre-rendered georeferenced
  map tiles. More efficient than WMS for large-scale mapping because tiles are cached
  and served at fixed scales rather than rendered on-demand.

  Supports GetTile (retrieve tile), GetCapabilities (service metadata), and GetFeatureInfo
  (optional). Defines tile matrix sets for different projections. Used for high-performance
  basemaps and widely supported by GeoServer, MapServer, and web mapping clients.

