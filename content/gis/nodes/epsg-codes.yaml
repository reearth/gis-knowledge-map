    - wgs84
    - web-mercator
    - utm
    - reprojection
    - crs

learningOutcomes:
  - Look up and identify EPSG codes for any location
  - Understand the structure of common EPSG code ranges
  - Use EPSG codes in GIS software and geospatial libraries
  - Recognize and avoid deprecated EPSG codes
  - Convert between EPSG codes and other CRS representations

