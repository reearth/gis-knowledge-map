id: map-projection
title: Map Projection
aliases: []

type: spatial-reference-systems
parentNode: spatial-reference-systems-group
difficulty: intermediate
importance: critical
estimatedTime: 60 minutes

summary: Map projection is the mathematical transformation that converts locations from Earth's curved 3D surface (ellipsoid) to a flat 2D map.
description: >
  Map projection is the mathematical transformation that converts locations from Earth's curved 3D surface (ellipsoid) to a flat 2D map. All projections introduce distortions in area, shape, distance, or direction. Understanding projection properties and trade-offs is essential for selecting the right projection for your mapping purpose and minimizing distortion in your area of interest.

style:
  color: "#10B981"
  icon: "map"

topics:
  - Projection classes (cylindrical, conic, azimuthal)
  - Projection properties (conformal, equal-area, equidistant, azimuthal)
  - Common projections (Mercator, Transverse Mercator, Lambert, Albers)
  - Projection distortion patterns and Tissot's indicatrix
  - Standard lines (parallels, meridians)
  - Projection parameters (false easting/northing, central meridian, scale factor)

prerequisites:
  - basic-gis-concepts
  - coordinate-systems
  - crs
  - datum

relationships:
  related:
    - utm
    - web-mercator
    - epsg-codes
    - reprojection

learningOutcomes:
  - Classify projections by their geometric construction
  - Identify which properties are preserved in different projections
  - Select appropriate projections based on purpose and region
  - Recognize and minimize projection-induced distortions
  - Configure projection parameters for custom use cases

