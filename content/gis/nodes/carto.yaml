summary: Cloud-native location intelligence platform for spatial analytics, visualization, and application development.
description: |
  CARTO is a cloud-native spatial analytics platform built on modern data warehouses
  (BigQuery, Snowflake, Redshift, PostgreSQL). Provides tools for spatial data science,
  location intelligence, and building custom spatial applications.

  Features include CARTO Builder (no-code map creation), Analytics Toolbox (SQL functions
  for spatial analysis), deck.gl-based visualizations, and APIs for developers. Emphasizes
  scalable cloud-native architecture and integration with data warehouse ecosystems.

