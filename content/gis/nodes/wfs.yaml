importance: critical

summary: OGC standard for serving and editing vector features (geometry and attributes) over HTTP.
description: |
  Web Feature Service (WFS) is an OGC standard for requesting and modifying vector geographic
  features over HTTP. Unlike WMS (which returns images), WFS returns actual feature data with
  geometry and attributes in formats like GML, GeoJSON, or Shapefile.

  Supports GetFeature (retrieve features), DescribeFeatureType (schema info), GetCapabilities
  (service metadata), and transactional operations (insert, update, delete). Essential for
  data interoperability and enabling clients to perform analysis on source data.

