summary: An open-source server for sharing, processing, and editing geospatial data using open standards.
description: |
  GeoServer is an open-source server that allows you to share, process and edit geospatial data.
  Designed for interoperability, it publishes data from major spatial data sources using open standards
  (WMS, WFS, WCS, WMTS).

  Built on GeoTools, supports various data formats (Shapefile, PostGIS, GeoTIFF, etc.), and provides
  powerful styling (SLD/CSS), reprojection, and caching capabilities. Enterprise-ready and widely deployed.

