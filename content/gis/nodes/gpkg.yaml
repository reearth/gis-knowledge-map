id: gpkg
title: GeoPackage
aliases: [GPKG, OGC GeoPackage]

type: data-formats
parentNode: data-formats-group
difficulty: intermediate
importance: important

summary: A modern, open standard SQLite-based format for storing vector and raster geospatial data.
description: |
  GeoPackage is an OGC standard that uses SQLite as its container format. It was designed as
  a modern replacement for Shapefiles, addressing many of their limitations.

  A single .gpkg file can store multiple vector layers, raster datasets, tiles, attributes, and
  spatial indexes. It supports transaction handling, has no file size limits, and can be used
  on mobile devices. GeoPackage is increasingly becoming the preferred format for data exchange
  in the GIS community.

