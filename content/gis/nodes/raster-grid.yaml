summary: Regular grid of cells (pixels) where each cell contains a value representing a continuous phenomenon like elevation, temperature, precipitation, or land cover classification.
description: |
  A Raster Grid is a data model that represents space as a regular matrix of cells (pixels),
  where each cell stores a value. Rasters are ideal for modeling continuous phenomena like
  elevation, temperature, rainfall, spectral reflectance, or discrete classifications like
  land cover types. Each cell represents a fixed area on the ground determined by the spatial
  resolution (e.g., 30m x 30m).

  Raster data is characterized by rows, columns, cell size, extent, and coordinate reference
  system. Values can be numeric (integers or floats) or categorical. Rasters support multi-band
  storage (e.g., RGB imagery, multispectral data) and efficient storage of spatially continuous
  data. They are fundamental to remote sensing, terrain analysis, and environmental modeling.

