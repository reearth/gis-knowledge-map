summary: Standard tile naming scheme using X, Y, Z coordinates for web map tiles (zoom/x/y.png).
description: |
  XYZ tiles are the most common tile naming convention used in web mapping. Files are organized
  in a directory structure: {z}/{x}/{y}.png where Z is zoom level, X is column, and Y is row.

  Origin is top-left corner, Y increases downward (unlike TMS). Used by OpenStreetMap, Mapbox,
  Google Maps, and most web mapping libraries. Simple, efficient, and widely supported for both
  raster and vector tiles. Standard format for tile-based web maps.

