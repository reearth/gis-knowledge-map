summary: Continuous grid-based spatial data where the geographic area is divided into cells (pixels), and each cell contains a single value representing a phenomenon.
description: |
  Continuous grid-based spatial data where the geographic area is divided into cells (pixels), and each cell contains a single value representing a phenomenon. Rasters are ideal for representing continuous surfaces like elevation, temperature, satellite imagery, and aerial photography.

