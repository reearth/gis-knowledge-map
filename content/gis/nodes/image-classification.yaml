id: image-classification
title: Image Classification
aliases: [Land Cover Classification, Supervised Classification, Remote Sensing Classification]

type: remote-sensing
parentNode: remote-sensing-group
difficulty: advanced
importance: critical

summary: Categorizing pixels into thematic classes like forest, water, urban for land cover mapping.
description: |
  Image classification assigns pixels or objects in remote sensing imagery to thematic
  categories (land cover classes) like forest, water, urban, agriculture, bare soil.
  Essential for land cover mapping, change detection, and environmental monitoring.

  Supervised classification: train with known samples (Random Forest, SVM, Neural Networks).
  Unsupervised: algorithms find natural clusters (K-means, ISODATA). Object-based (OBIA):
  segment then classify groups of pixels. Modern approaches use deep learning (CNNs, U-Net).
  Requires ground truth data and accuracy assessment (confusion matrix, kappa).

