summary: Web Mercator (EPSG:3857) is a variant of the Mercator projection that has become the de facto standard for web mapping.
description: >
  Web Mercator (EPSG:3857) is a variant of the Mercator projection that has become the de facto standard for web mapping. Used by Google Maps, OpenStreetMap, Bing Maps, and most web mapping libraries, it treats Earth as a sphere (not ellipsoid) for simpler tile calculations. While geometrically imprecise and severely distorting areas near poles, its ubiquity and tile-friendly properties make it essential for web-based GIS applications.

style:
  color: "#10B981"
  icon: "globe"

topics:
  - Web Mercator vs traditional Mercator differences
  - Spherical projection (simplified WGS84 ellipsoid to sphere)
  - EPSG:3857 vs EPSG:3785 vs EPSG:900913
  - Tile pyramid structure (zoom levels 0-22+)
  - Latitude limits (approximately ±85.05°)
  - Area distortion characteristics
  - Web mapping standards (XYZ tiles, WMTS)

