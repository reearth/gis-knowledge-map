type: tile-delivery-systems
difficulty: intermediate
importance: important
isGroup: true

summary: Systems and protocols for efficiently delivering map imagery and vector data as tiles.
description: |
  Tile delivery systems break maps into small, cacheable tiles for efficient web delivery.
  This includes raster tile schemes (XYZ, TMS), vector tiles (MVT), and related technologies
  like tile caching and CDN delivery. Tiling is fundamental to modern web mapping performance,
  enabling fast, scalable map rendering by pre-generating or dynamically serving small
  map sections that can be cached and reused.

