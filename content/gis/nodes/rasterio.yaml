summary: Python library for reading and writing geospatial raster data, built on GDAL with a clean, Pythonic API.
description: |
  Rasterio is a Python library designed to make working with geospatial raster data more accessible
  and intuitive. Built on top of GDAL, it provides a clean API that integrates well with NumPy
  and other scientific Python libraries.

  Rasterio simplifies common tasks like reading/writing raster datasets, reprojecting data,
  masking and windowing operations, and working with Cloud Optimized GeoTIFFs (COGs). It's the
  de-facto standard for raster processing in Python geospatial workflows.

