summary: An XML-based format for geographic data visualization, originally created for Google Earth.
description: |
  KML (Keyhole Markup Language) is an XML notation for expressing geographic annotation and visualization
  within Internet-based maps and Earth browsers like Google Earth.

  KMZ is a compressed version of KML that can include images and other resources in a single archive.

