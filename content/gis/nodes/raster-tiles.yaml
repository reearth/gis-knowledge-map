id: raster-tiles
title: Raster Tiles
aliases: [Image Tiles, Bitmap Tiles]

type: tile-delivery-systems
parentNode: tile-delivery-systems-group
difficulty: beginner
importance: critical

summary: Pre-rendered image tiles (PNG, JPEG, WebP) for fast web map delivery with minimal client processing.
description: |
  Raster tiles are pre-rendered image files (typically 256x256 or 512x512 pixels) that form
  a pyramid of map images at different zoom levels. Fast to deliver and display but styling
  is fixed at render time.

  Common formats: PNG (transparency support), JPEG (smaller file size), WebP (modern compression).
  Generated by tile servers from vector data or imagery. Trade-off: fast performance but
  inflexible styling and larger storage requirements than vector tiles.

