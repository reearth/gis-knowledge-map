id: scale
title: Scale
aliases: []

type: core-concepts
parentNode: core-concepts-group
difficulty: beginner
importance: critical

summary: The relationship between distance on a map and the corresponding distance on Earth's surface, expressed as a ratio or verbal description.
description: |
  The relationship between distance on a map and the corresponding distance on Earth's surface, expressed as a ratio (e.g., 1:24,000) or verbal description. Scale determines the level of generalization and detail shown on a map. Large-scale maps show more detail for smaller areas, while small-scale maps show less detail for larger areas.

