  - id: processing-tools
    label: Processing Tools
    color: "#14B8A6"
    icon: "wrench"
  - id: analysis-libraries
    label: Analysis Libraries
    color: "#06B6D4"
    icon: "library"
  - id: gis-servers-services
    label: GIS Servers & Services
    color: "#F97316"
    icon: "server"
  - id: tile-delivery-systems
    label: Tile & Delivery Systems
    color: "#F59E0B"
    icon: "grid-3x3"
  - id: web-mapping-libraries
    label: Web Mapping Libraries
    color: "#FB923C"
