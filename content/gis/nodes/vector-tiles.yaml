summary: Tiles containing vector geometry data for client-side rendering and dynamic styling.
description: |
  Vector tiles contain geometric and attribute data in a compact binary format (typically
  Mapbox Vector Tile/MVT) for client-side rendering. Enable dynamic styling, smooth zooming,
  rotation, and interactive features.

  Significantly smaller than raster tiles, support runtime styling changes, language switching,
  and high-DPI displays. Standard format: MVT (Mapbox Vector Tiles) in Protocol Buffers.
  Supported by Mapbox GL, MapLibre, OpenLayers, and Leaflet (with plugins).

