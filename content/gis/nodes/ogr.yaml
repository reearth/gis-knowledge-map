summary: Vector data library component of GDAL for reading, writing, and converting vector geospatial data formats.
description: |
  OGR Simple Features Library is the vector data handling component of GDAL, providing a unified API
  for reading and writing multiple vector formats. It supports format conversion, coordinate system
  transformations, and spatial/attribute filtering.

  Key utilities include ogr2ogr for vector conversion, ogrinfo for data inspection, and ogr_merge
  for combining datasets. OGR is widely used as the backend for vector operations in many GIS applications.

