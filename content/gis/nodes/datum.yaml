id: datum
title: Geodetic Datum
aliases: []

type: spatial-reference-systems
parentNode: spatial-reference-systems-group
difficulty: advanced
importance: critical
estimatedTime: 50 minutes

summary: A geodetic datum is a reference surface (typically an ellipsoid) and a coordinate system used to define positions on Earth.
description: >
  A geodetic datum is a reference surface (typically an ellipsoid) and a coordinate system used to define positions on Earth. It provides the foundation for measuring locations by approximating Earth's irregular shape. Different datums can result in position differences of hundreds of meters for the same coordinates, making datum understanding crucial for accurate geospatial work.

style:
  color: "#10B981"
  icon: "globe"

topics:
  - Ellipsoid models of Earth (sphere vs ellipsoid)
  - Horizontal datums (NAD83, WGS84, ETRS89)
  - Vertical datums (mean sea level, geoid models)
  - Local vs global datums
  - Datum transformations and shift parameters
  - Geoid vs ellipsoid relationship

prerequisites:
  - basic-gis-concepts
  - coordinate-systems
  - crs

relationships:
  related:
    - wgs84
    - crs
    - map-projection
    - reprojection

learningOutcomes:
  - Distinguish between ellipsoid, geoid, and actual Earth surface
  - Understand why different datums exist and when to use each
  - Recognize datum-related positional errors
  - Apply datum transformations correctly
  - Select appropriate datums for regional vs global projects

