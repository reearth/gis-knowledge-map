summary: Server-side caching systems for pre-generating and storing map tiles to improve performance.
description: |
  Tile caching systems pre-generate and store map tiles to avoid repeated rendering,
  dramatically improving map delivery performance. Popular implementations include
  MapProxy, TileCache, GeoWebCache, and mod_tile.

  Supports seeding (pre-generation), on-demand caching, cache expiration, and multiple
  backends (filesystem, S3, Redis). Can cache both raster and vector tiles. Essential
  for high-traffic map services and reducing server load.

