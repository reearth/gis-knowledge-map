difficulty: advanced
importance: critical

summary: A translator library for raster and vector geospatial data formats, providing command-line utilities and APIs.
description: |
  GDAL (Geospatial Data Abstraction Library) is a computer software library for reading and writing
  raster and vector geospatial data formats. It's used by most GIS software and is the de-facto
  standard for geospatial data translation.

  Includes command-line utilities like gdalwarp, gdal_translate, ogr2ogr, and more.

