id: polygon
title: Polygon
aliases: []

type: data-models
parentNode: data-models-group
difficulty: beginner
importance: critical

summary: Two-dimensional geometry representing areas with defined boundaries, such as land parcels, lakes, administrative boundaries, building footprints, or land use zones.
description: |
  A Polygon is a vector geometry type representing a two-dimensional area enclosed by one or
  more closed linear rings. The outer ring defines the polygon boundary, while optional inner
  rings represent holes. Polygons are used to model area features such as land parcels, water
  bodies, administrative boundaries, zoning districts, building footprints, or ecological zones.

  Polygons have both perimeter (boundary length) and area. They must be topologically closed
  (first and last points identical) and typically follow rules like non-self-intersection.
  MultiPolygons allow representation of disconnected areas as a single feature (e.g., a country
  with islands). Polygons are fundamental for area calculations, spatial overlay operations,
  and territorial analysis.

