summary: The standard coordinate system used by GPS and most web mapping applications worldwide.
description: |
  WGS84 (World Geodetic System 1984) is the coordinate system used by GPS satellites and is the
  de facto standard for latitude/longitude coordinates on Earth.

  EPSG:4326 is the most common identifier for WGS84. Web Mercator (EPSG:3857) is a projection of WGS84
  used by most web mapping applications like Google Maps, OpenStreetMap, and Leaflet.

