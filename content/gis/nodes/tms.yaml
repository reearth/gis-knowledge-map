id: tms
title: TMS
aliases: [Tile Map Service, OSGeo TMS]

type: tile-delivery-systems
parentNode: tile-delivery-systems-group
difficulty: intermediate
importance: important

summary: OGC Tile Map Service specification with bottom-left origin (Y-axis flipped from XYZ).
description: |
  TMS (Tile Map Service) is an OSGeo specification for serving map tiles. The key difference
  from XYZ is the Y-axis origin: TMS uses bottom-left origin with Y increasing upward,
  matching standard cartographic coordinates.

  Defined by OSGeo, includes metadata about tile sets (bounds, projections, formats).
  Requires coordinate transformation when used with XYZ-based clients. Supported by
  GeoServer, MapServer, and other enterprise GIS servers.

