summary: Discrete geographic features represented as points, lines, and polygons using coordinate geometry.
description: |
  Discrete geographic features represented as points, lines, and polygons using coordinate geometry. Vector data is ideal for representing distinct objects with well-defined boundaries, such as roads, buildings, parcels, and administrative boundaries. Each feature has geometry and associated attributes.

