summary: A data structure that optimizes the performance of spatial queries and operations by organizing features based on their location.
description: |
  A data structure that optimizes the performance of spatial queries and operations by organizing features based on their location. Spatial indexes (such as R-trees, Quadtrees, or grid indexes) enable rapid filtering of features, dramatically improving query speed for large datasets.

