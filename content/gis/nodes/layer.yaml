summary: A thematic collection of geographic features or phenomena displayed together as a single unit in a GIS.
description: |
  A thematic collection of geographic features or phenomena displayed together as a single unit in a GIS. Layers allow users to organize spatial data by theme and control visibility, making it easier to analyze and visualize complex geographic information.

