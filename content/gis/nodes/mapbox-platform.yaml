summary: Mapbox's comprehensive location platform providing mapping, geocoding, navigation, and spatial services.
description: |
  Mapbox Platform provides developer-focused location services including custom maps,
  geocoding, directions, navigation, search, and spatial analytics. Known for customizable
  vector maps and high-performance rendering.

  Includes Mapbox GL JS/Native SDKs, Mapbox Studio (visual map design), Tilesets API,
  Geocoding API, Navigation SDK, and more. Powers location features for major apps
  (Snapchat, Instacart, The Weather Channel). Pay-as-you-go pricing model.

