summary: OGC standard for serving multi-dimensional coverage data (rasters) with full data values.
description: |
  Web Coverage Service (WCS) is an OGC standard for accessing and retrieving coverage data
  (rasters, grids, point clouds) with original data values rather than rendered images.
  Enables clients to download and analyze actual raster data.

  Supports GetCoverage (retrieve raster data), DescribeCoverage (detailed metadata),
  GetCapabilities (service info). Can request subsets, different formats (GeoTIFF, NetCDF),
  reprojection, and band selection. Used for scientific data, satellite imagery, and DEM access.

