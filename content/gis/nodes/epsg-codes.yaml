commonEPSGCodes:
  - code: "EPSG:4326"
    name: "WGS 84 - Geographic"
    description: "Global latitude/longitude in decimal degrees"
  - code: "EPSG:3857"
    name: "WGS 84 / Pseudo-Mercator"
    description: "Web Mercator (Google Maps, OSM)"
  - code: "EPSG:4269"
    name: "NAD83 - Geographic"
    description: "North American Datum 1983"
  - code: "EPSG:32601-32660"
    name: "WGS 84 / UTM zones 1-60 North"
    description: "UTM Northern Hemisphere"
  - code: "EPSG:32701-32760"
    name: "WGS 84 / UTM zones 1-60 South"
    description: "UTM Southern Hemisphere"
  - code: "EPSG:3395"
    name: "WGS 84 / World Mercator"
    description: "True Mercator (ellipsoidal)"
  - code: "EPSG:2154"
    name: "RGF93 / Lambert-93"
    description: "France official projection"
  - code: "EPSG:27700"
    name: "OSGB 1936 / British National Grid"
    description: "UK official grid"

commonMistakes:
  - Using deprecated EPSG codes (e.g., EPSG:3785 instead of 3857)
  - Confusing EPSG:4326 (geographic) with EPSG:3857 (projected)
  - Not specifying EPSG code when sharing geospatial data
  - Assuming EPSG codes are interchangeable
  - Using informal/non-standard codes (EPSG:900913)

realWorldApplications:
  - Geospatial data metadata and file headers (GeoTIFF, GeoJSON)
  - Web mapping APIs and services (specify input/output CRS)
  - Database spatial columns (PostGIS SRID values)
  - Coordinate transformation in GDAL, PROJ, pyproj
  - Cross-platform GIS data exchange

advancedTopics:
  - EPSG database structure and SQL access
  - Creating custom EPSG codes for organizational use
  - EPSG vs ESRI CRS differences
  - OGC WKT and CRS representation standards
  - Vertical CRS and compound CRS EPSG codes
  - EPSG code deprecation and supersession chains

toolSupport:
  - QGIS: Built-in EPSG database and CRS selector
  - GDAL/OGR: "-s_srs EPSG:4326 -t_srs EPSG:3857"
  - PostGIS: "ST_Transform(geom, 3857)"
  - pyproj: "CRS.from_epsg(4326)"
  - PROJ: "+init=epsg:4326"
  - Leaflet: "crs: L.CRS.EPSG3857"

