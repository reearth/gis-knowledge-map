summary: A high-performance JavaScript library for displaying map data in web browsers.
description: |
  OpenLayers makes it easy to put a dynamic map in any web page. It can display map tiles, vector data
  and markers loaded from any source. It's been developed to further the use of geographic information
  of all kinds and is completely free, open source JavaScript.

  Supports a wide variety of data sources and formats including WMS, WMTS, XYZ, Vector Tiles, and more.

