id: utm
title: Universal Transverse Mercator (UTM)
aliases: []

type: spatial-reference-systems
parentNode: spatial-reference-systems-group
difficulty: intermediate
importance: important
estimatedTime: 40 minutes

summary: Universal Transverse Mercator (UTM) is a global coordinate system that divides Earth into 60 north-south zones, each 6 degrees of longitude wide.
description: >
  Universal Transverse Mercator (UTM) is a global coordinate system that divides Earth into 60 north-south zones, each 6 degrees of longitude wide. Each zone uses a transverse Mercator projection optimized for that region, providing accurate metric coordinates with minimal distortion. UTM is widely used for topographic mapping, military grids, and regional spatial analysis due to its standardization and meter-based units.

style:
  color: "#10B981"
  icon: "map-pin"

topics:
  - UTM zone structure (60 zones, 6-degree width)
  - Zone numbering and lettering (1-60, C-X)
  - Transverse Mercator projection per zone
  - False easting (500,000m) and false northing (0m North, 10,000,000m South)
  - Central meridian and scale factor (0.9996)
  - Coordinate format (zone + easting + northing)
  - UTM zone selection and overlap handling

prerequisites:
  - crs
  - datum
  - map-projection
  - coordinate-systems

relationships:
  related:
    - wgs84
    - epsg-codes
    - map-projection
    - reprojection

learningOutcomes:
  - Determine the correct UTM zone for any location
  - Read and write UTM coordinates correctly
  - Understand UTM distortion characteristics and limitations
  - Convert between geographic coordinates and UTM
  - Recognize when to use UTM vs other coordinate systems

