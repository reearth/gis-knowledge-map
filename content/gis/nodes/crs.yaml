id: crs
title: Coordinate Reference System (CRS)
aliases: []

type: spatial-reference-systems
parentNode: spatial-reference-systems-group
difficulty: intermediate
importance: critical
estimatedTime: 45 minutes

summary: A Coordinate Reference System (CRS) is a framework that uses coordinates to uniquely identify locations on Earth's surface.
description: >
  A Coordinate Reference System (CRS) is a framework that uses coordinates to uniquely identify locations on Earth's surface. It combines a coordinate system, a datum (reference surface), and a projection method to define how spatial data relates to real-world positions. Understanding CRS is fundamental to working with any geospatial data.

style:
  color: "#10B981"
  icon: "compass"

topics:
  - Geographic vs Projected CRS
  - CRS components (datum, ellipsoid, prime meridian, units)
  - Coordinate system types (Cartesian, spherical, cylindrical)
  - CRS identification (EPSG codes, WKT, PROJ strings)
  - Importance of consistent CRS across datasets

prerequisites:
  - basic-gis-concepts
  - coordinate-systems

relationships:
  related:
    - datum
    - map-projection
    - epsg-codes
    - wgs84
    - reprojection

learningOutcomes:
  - Understand the difference between geographic and projected coordinate systems
  - Identify CRS from metadata and EPSG codes
  - Recognize when CRS mismatches cause spatial errors
  - Select appropriate CRS for different mapping scenarios

