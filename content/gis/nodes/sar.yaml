summary: Active microwave imaging that penetrates clouds and darkness for all-weather Earth observation.
description: |
  Synthetic Aperture Radar (SAR) is an active remote sensing technique using microwave
  radiation to create images regardless of clouds, darkness, or weather. Unlike optical
  sensors, SAR provides its own illumination and penetrates cloud cover.

  Major SAR missions: Sentinel-1 (free, C-band), RADARSAT, TerraSAR-X, ALOS PALSAR.
  Applications: flood monitoring, ship detection, ice monitoring, ground deformation
  (InSAR), soil moisture. Requires specialized processing (complex data, speckle filtering).
  Essential for tropical/cloudy regions and emergency response.

