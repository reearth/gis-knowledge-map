id: cog
title: Cloud Optimized GeoTIFF
aliases: [COG]

type: data-formats
parentNode: data-formats-group
difficulty: intermediate
importance: important

summary: A GeoTIFF variant with internal tiling and overviews optimized for efficient cloud-based access.
description: |
  Cloud Optimized GeoTIFF (COG) is a regular GeoTIFF file with a specific internal organization
  that enables efficient streaming and partial reading from cloud storage without downloading the entire file.

  COGs use internal tiling, overviews (pyramids), and HTTP range requests to allow clients to fetch
  only the data they need. This makes them ideal for web mapping, serverless architectures, and
  working with large datasets stored in cloud object storage like S3 or GCS.

