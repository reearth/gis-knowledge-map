summary: A spatial database extender for PostgreSQL that adds support for geographic objects.
description: |
  PostGIS extends PostgreSQL to handle geographic data, allowing location queries
  to be run in SQL. It includes support for geographic objects, spatial indexing,
  and numerous spatial functions for analysis.


