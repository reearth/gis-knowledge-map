summary: Graph-based data structure representing connected linear features with topology and attributes for routing, navigation, and network analysis across transportation, utility, and flow systems.
description: |
  A Network Dataset is a specialized data model that represents interconnected linear features
  as a mathematical graph structure with nodes (junctions) and edges (links). It goes beyond
  simple line geometry by encoding connectivity, directionality, impedance (cost/travel time),
  restrictions, and hierarchies necessary for routing and network analysis.

  Network datasets are essential for transportation routing (shortest path, optimal routes),
  service area analysis, location-allocation problems, and utility network tracing. They support
  turn restrictions, one-way streets, time-dependent costs, and multi-modal transportation.
  Common applications include GPS navigation, logistics optimization, emergency response planning,
  and infrastructure network management (roads, water, electricity, telecommunications).

