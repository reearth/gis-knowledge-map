summary: Google's planetary-scale platform for geospatial analysis with petabytes of satellite imagery and computing power.
description: |
  Google Earth Engine is a cloud-based platform for planetary-scale environmental data
  analysis, combining a multi-petabyte catalog of satellite imagery and geospatial datasets
  with massive computational capabilities for parallel processing.

  Provides access to Landsat, Sentinel, MODIS, and hundreds of other datasets updated daily.
  JavaScript and Python APIs for analysis, machine learning integration, time-series analysis,
  and change detection. Used for climate research, deforestation monitoring, agriculture, and
  environmental science. Free for research and education.

