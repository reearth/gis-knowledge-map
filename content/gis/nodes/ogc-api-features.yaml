summary: Modern RESTful API standard replacing WFS for accessing and querying vector features.
description: |
  OGC API - Features is a modern, web-friendly standard for accessing vector geospatial
  features. It replaces WFS with a RESTful architecture using JSON, HTML, and standard
  HTTP methods, making it easier to use than traditional XML-based OGC services.

  Built on OpenAPI, supports GeoJSON and HTML responses, pagination, CQL2 filtering,
  and simple URLs. Part of the OGC API family modernizing geospatial standards. Growing
  support in GeoServer, pygeoapi, and other servers.

