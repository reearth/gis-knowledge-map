summary: Open-source GIS software for geospatial data management, analysis, and modeling with powerful raster capabilities.
description: |
  GRASS GIS (Geographic Resources Analysis Support System) is a free, open-source GIS
  with extensive capabilities for raster and vector data processing, image analysis,
  spatial modeling, and visualization. Originally developed by the US Army in 1982.

  Particularly strong in raster analysis, terrain modeling, hydrological analysis, and
  remote sensing. Includes 500+ modules for spatial analysis. Command-line and GUI interfaces,
  Python API, integrates with QGIS. Used in academia, research, and environmental modeling.

