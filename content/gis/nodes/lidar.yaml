summary: Active remote sensing using laser pulses to create precise 3D point clouds of terrain and objects.
description: |
  LiDAR (Light Detection and Ranging) uses laser pulses to measure distances, creating
  dense 3D point clouds of the Earth's surface and objects. Unlike passive imagery,
  LiDAR actively emits light and measures return times for precise elevation data.

  Airborne LiDAR from aircraft/drones, terrestrial LiDAR from ground scanners, mobile LiDAR
  from vehicles. Applications: high-accuracy DEMs, forestry (tree height/canopy), flood
  modeling, infrastructure monitoring, archaeology (revealing hidden structures). Output
  format: LAS/LAZ point clouds. Vegetation penetration enables "bare earth" models.

