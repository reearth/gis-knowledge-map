type: analysis-libraries
parentNode: analysis-libraries-group
difficulty: intermediate
importance: critical

summary: A Python library that extends pandas to enable spatial operations on geometric types.
description: |
  GeoPandas extends the pandas DataFrame to support spatial data types and operations.
  It combines the capabilities of pandas for data manipulation with Shapely for geometric
  operations and Fiona for file I/O.

  Provides a GeoDataFrame object that can perform spatial operations (overlay, spatial joins,
  buffer, distance calculations) while maintaining the familiar pandas interface. Supports
  reading and writing common GIS formats (Shapefile, GeoJSON, GeoPackage, PostGIS).

