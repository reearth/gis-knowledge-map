practicalExercises:
  - Display a WGS84 dataset on a Web Mercator basemap
  - Calculate area measurements and compare with equal-area projection
  - Convert between EPSG:4326 and EPSG:3857 programmatically
  - Implement tile coordinate conversion (lat/lon to tile x/y/z)
  - Visualize area distortion at different latitudes

commonMistakes:
  - Using Web Mercator for area calculations (massive distortion)
  - Not reprojecting data from EPSG:4326 to EPSG:3857 for web display
  - Assuming Web Mercator is accurate for analysis
  - Displaying polar or high-latitude data (>85°) in Web Mercator
  - Confusing Web Mercator with true Mercator projection

realWorldApplications:
  - Google Maps, OpenStreetMap, Bing Maps base layers
  - Web mapping libraries (Leaflet, Mapbox GL JS, OpenLayers)
  - Mobile mapping applications
  - Web-based GIS dashboards and applications
  - Real-time location tracking and visualization

technicalDetails:
  epsgCode: "3857"
  alternativeCodes: "EPSG:3785 (deprecated), EPSG:900913 (unofficial)"
  basedOn: "Spherical Mercator (WGS84 datum treated as sphere)"
  units: "meters"
  latitudeLimits: "±85.0511287798°"
  falseEasting: "0"
  falseNorthing: "0"
  tileScheme: "XYZ (zoom/x/y), 256×256 or 512×512 pixel tiles"

advantages:
  - Universal adoption in web mapping ecosystem
  - Simple tile pyramid structure for efficient caching
  - Fast client-side coordinate transformations
  - Preserves angles (locally conformal)
  - Square tiles at all zoom levels

disadvantages:
  - Severe area distortion (Greenland appears larger than Africa)
  - Not suitable for polar regions (>85° latitude)
  - Not a proper ellipsoidal projection (uses sphere)
  - Inappropriate for area-based analysis
  - Not recognized by some official mapping agencies

