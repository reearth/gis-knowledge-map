summary: Cloud-based platforms and SaaS services for creating, sharing, and collaborating on maps online.
description: |
  Cloud GIS platforms provide web-based environments for mapping and spatial analysis without
  requiring local software installation. They emphasize ease of use, collaboration, and sharing.
  These platforms are ideal for teams, non-technical users, and scenarios requiring quick
  map creation and sharing without deep GIS expertise. Examples include Felt, ArcGIS Online,
  CARTO, Google Earth Engine, Mapbox Platform, and kepler.gl.

