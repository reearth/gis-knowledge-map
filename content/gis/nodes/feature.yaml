id: feature
title: Feature
aliases: []

type: core-concepts
parentNode: core-concepts-group
difficulty: beginner
importance: critical

summary: A discrete geographic element representing a real-world object or phenomenon.
description: |
  A discrete geographic element representing a real-world object or phenomenon. Features have both spatial components (geometry) and non-spatial information (attributes). Examples include buildings (polygons), roads (lines), and wells (points).

