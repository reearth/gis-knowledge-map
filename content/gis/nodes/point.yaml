id: point
title: Point
aliases: []

type: data-models
parentNode: data-models-group
difficulty: beginner
importance: critical

summary: Zero-dimensional geometry representing discrete locations in space, such as GPS coordinates, points of interest, city locations, or sensor positions.
description: |
  A Point is the most fundamental vector geometry type, representing a single location in space
  defined by coordinates (X, Y, and optionally Z for elevation or M for measures). Points are
  used to represent discrete features that don't have length or area at the map scale, such as
  GPS waypoints, landmarks, cities on small-scale maps, sample locations, or sensor stations.

  Points are stored as coordinate pairs/triplets and can carry attribute data describing the
  feature they represent. They form the basis for more complex geometries and are essential
  for geocoding, spatial analysis, and location-based services.

