summary: Dense collection of 3D points captured from LiDAR scanning or photogrammetry, where each point has X, Y, Z coordinates and often additional attributes like intensity or RGB color.
description: |
  A Point Cloud is a data model consisting of millions or billions of 3D points representing
  the surface geometry of objects, terrain, and structures. Each point typically has X, Y, Z
  coordinates and may include additional attributes such as intensity (laser return strength),
  RGB color values, classification codes, return numbers, or timestamps.

  Point clouds are primarily acquired through LiDAR (Light Detection and Ranging) sensors or
  photogrammetric processing of overlapping images. They provide highly detailed 3D
  representations of environments and are used for terrain modeling, building extraction,
  vegetation analysis, infrastructure inspection, and autonomous vehicle navigation. Point
  clouds can be processed into DEMs, DSMs, 3D meshes, or classified feature datasets.

