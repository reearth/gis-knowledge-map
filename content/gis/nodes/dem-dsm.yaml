summary: Digital Elevation Model (bare earth surface) and Digital Surface Model (top surface including vegetation and structures) - raster representations of terrain and surface heights.
description: |
  Digital Elevation Models (DEMs) and Digital Surface Models (DSMs) are specialized raster datasets
  representing surface heights. A DEM represents the bare earth terrain elevation (ground surface
  without vegetation or structures), while a DSM represents the top surface including trees,
  buildings, and other features. DTM (Digital Terrain Model) is another term often used
  interchangeably with DEM.

  These models are fundamental for terrain analysis, including slope/aspect calculation, watershed
  delineation, viewshed analysis, 3D visualization, and hydrological modeling. DEMs are created
  from contour lines, survey data, photogrammetry, or LiDAR point clouds. Common formats include
  GeoTIFF, USGS DEM, and SRTM. Resolution ranges from global datasets (~30-90m) to high-resolution
  local surveys (<1m).

