summary: Earth observation imagery from satellites like Landsat, Sentinel, Planet, and commercial providers.
description: |
  Satellite imagery provides systematic Earth observation from orbital platforms, enabling
  monitoring of environmental change, land use, agriculture, disasters, and urban development.
  Available from government (Landsat, Sentinel, MODIS) and commercial sources (Planet, Maxar).

  Key satellites: Landsat (30m, free, 40+ years), Sentinel-2 (10m, free, ESA), MODIS (250m, daily),
  Planet (3m, daily), Maxar/WorldView (30cm, commercial). Multispectral bands enable vegetation
  analysis (NDVI), water detection, thermal monitoring. Accessible via Google Earth Engine,
  AWS Open Data, and commercial APIs.

