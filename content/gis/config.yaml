# Define relationship types
relationshipTypes:
  - id: prerequisite
    label: Prerequisite of
    color: "#EF4444"
    style: dashed
  - id: partOf
    label: Part of
    color: "#6B7280"
    style: solid
  - id: related
    label: Related to
    color: "#9CA3AF"
    style: dotted
  - id: enables
    label: Enables
    color: "#10B981"
    style: solid
  - id: usedBy
    label: Used by
    color: "#F59E0B"
    style: solid

# Categories are now combined with nodeTypes above
categories: []

# Roles for filtering
roles:
  - id: gis-analyst
    label: GIS Analyst
  - id: gis-developer
    label: GIS Developer
  - id: cartographer
