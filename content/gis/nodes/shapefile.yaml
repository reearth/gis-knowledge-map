id: shapefile
title: Shapefile
aliases: [SHP, ESRI Shapefile]

type: data-formats
parentNode: data-formats-group
difficulty: beginner
importance: critical

summary: A widely-used vector data format developed by ESRI for storing geometric location and attribute information.
description: |
  Shapefile is one of the most common geospatial vector data formats. Despite its name, a shapefile
  is actually a collection of files (.shp, .shx, .dbf, and optionally .prj, .sbn, etc.) that work together.

  It has limitations (2GB file size, 10-character field names, limited data types) but remains widely supported.

