summary: Information about spatial data that describes its content, quality, condition, origin, and other characteristics.
description: |
  Information about spatial data that describes its content, quality, condition, origin, and other characteristics. Metadata includes details about data source, creation date, coordinate system, accuracy, update frequency, access constraints, and contact information, enabling proper data discovery, evaluation, and use.

