summary: OGC standard for streaming and rendering massive 3D geospatial datasets including buildings, point clouds, photogrammetry models, and terrain in web and desktop applications.
description: |
  3D Tiles is an OGC Community Standard for sharing, visualizing, and interacting with massive
  heterogeneous 3D geospatial content across desktop, web, and mobile applications. It uses a
  hierarchical level-of-detail structure to efficiently stream and render billions of 3D features
  by loading only visible tiles at appropriate detail levels.

  3D Tiles supports multiple content types: photogrammetry models (meshes), 3D buildings (BIM/CityGML),
  point clouds, instanced features, and composite tiles. The format uses spatial indexing and
  bounding volume hierarchies to enable fast visibility culling and progressive loading. It's
  designed for visualization of urban environments, digital twins, infrastructure projects,
  and large-scale 3D mapping applications. CesiumJS is the primary viewer implementation.

