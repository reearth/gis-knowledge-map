id: accuracy
title: Accuracy
aliases: []

type: core-concepts
parentNode: core-concepts-group
difficulty: beginner
importance: critical

summary: How close measurements or values in spatial data are to their true or accepted reference values.
description: |
  How close measurements or values in spatial data are to their true or accepted reference values. Accuracy encompasses both positional accuracy (how close feature locations are to actual positions) and attribute accuracy (correctness of descriptive data). It is distinct from precision, which refers to measurement repeatability.

