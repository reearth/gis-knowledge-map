summary: Python library for reading and writing vector geospatial data, providing a clean OGR/GDAL interface.
description: |
  Fiona is a Python wrapper for OGR that makes reading and writing vector geospatial data more
  intuitive and Pythonic. It focuses on providing a simple, consistent interface for working with
  vector formats without requiring knowledge of the underlying OGR/GDAL complexity.

  Fiona represents features as Python dictionaries compatible with the GeoJSON standard, making it
  easy to work with common Python tools. It's commonly used alongside GeoPandas for vector data
  manipulation and is the I/O foundation for many Python GIS workflows.

