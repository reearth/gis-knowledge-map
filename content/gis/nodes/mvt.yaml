id: mvt
title: Mapbox Vector Tiles
aliases: [MVT, PBF, Protocol Buffers]

type: tile-delivery-systems
parentNode: tile-delivery-systems-group
difficulty: intermediate
importance: important

summary: A specification for encoding tiled vector data using Google Protocol Buffers for efficient web map rendering.
description: |
  Mapbox Vector Tiles (MVT) is an open standard for representing geospatial vector data in tiles.
  Unlike raster tiles, vector tiles contain the actual geographic features (points, lines, polygons)
  which allows for dynamic styling, querying, and better resolution independence.

  Uses Protocol Buffers for compact, efficient encoding. Widely adopted by Mapbox, OpenMapTiles, and others.

