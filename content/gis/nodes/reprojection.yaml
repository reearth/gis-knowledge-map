practicalExercises:
  - Reproject a shapefile from EPSG:4326 to EPSG:3857 using QGIS
  - Use gdalwarp to reproject raster data with different resampling methods
  - Transform coordinates between NAD83 and WGS84 with datum shift parameters
  - Compare reprojection results using different transformation methods
  - Fix misaligned layers by identifying and correcting CRS issues

commonMistakes:
  - Reprojecting without understanding source/target CRS
  - Ignoring datum transformation parameters (using wrong or no shift grids)
  - Using inappropriate resampling for raster reprojection
  - Repeatedly reprojecting data (accumulating errors)
  - Not checking transformation accuracy and warnings
  - Assuming on-the-fly reprojection equals proper data reprojection

realWorldApplications:
  - Integrating GPS data (WGS84) with local mapping data
  - Preparing data for web mapping (converting to EPSG:3857)
  - Combining datasets from different countries or agencies
  - Converting between UTM zones for regional analysis
  - Aerial/satellite imagery orthorectification and georeferencing

tools:
  gdalwarp:
    description: "Raster reprojection with resampling"
    example: "gdalwarp -s_srs EPSG:4326 -t_srs EPSG:3857 -r bilinear input.tif output.tif"
  ogr2ogr:
    description: "Vector reprojection and format conversion"
    example: "ogr2ogr -s_srs EPSG:4326 -t_srs EPSG:32610 output.shp input.shp"
  QGIS:
    description: "Reproject Layer tool and on-the-fly reprojection"
    location: "Processing Toolbox > Vector general > Reproject layer"
  pyproj:
    description: "Python library for coordinate transformation"
    example: "transformer = Transformer.from_crs('EPSG:4326', 'EPSG:3857')"
  PROJ:
    description: "Core coordinate transformation library"
    example: "echo 2 49 | cs2cs EPSG:4326 EPSG:32632"

advancedTopics:
  - Grid-based datum transformations (NTv2, NADCON5)
  - Transformation pipelines and multi-step conversions
  - Time-dependent transformations for plate tectonics
  - Accuracy assessment and uncertainty propagation
  - Custom transformation grids for local datums
  - Raster resampling methods (nearest, bilinear, cubic, Lanczos)
  - Edge effects and null values in reprojected rasters

bestPractices:
  - Always verify source CRS before reprojection
  - Use appropriate transformation methods and accuracy
  - Reproject to target CRS once (avoid multiple transformations)
  - Document CRS and transformation parameters in metadata
  - Test reprojection with known control points
  - Use high-quality resampling for raster data
  - Preserve original data and work on copies

performanceConsiderations:
  - On-the-fly reprojection is slower than pre-reprojected data
  - Raster reprojection is computationally intensive
  - Vector reprojection is generally fast
  - Use appropriate file formats (GeoTIFF, GeoPackage) for better performance

