id: gis-servers-services-group
title: GIS Servers & Services
aliases: [Map Servers, OGC Services, Web Services]

type: gis-servers-services
difficulty: advanced
importance: important
isGroup: true

summary: Server software and web services that publish and serve geospatial data via standardized protocols.
description: |
  GIS Servers and Services are the backend infrastructure for delivering geospatial data over the web.
  They implement OGC standards (WMS, WFS, WCS, WMTS) and other protocols to serve map tiles,
  vector data, and raster data to client applications. This includes server software like
  GeoServer and MapServer, as well as standardized service protocols used for interoperability.

