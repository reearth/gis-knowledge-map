id: cesium
title: Cesium
aliases: [CesiumJS, Cesium for Unreal]

type: web-mapping-libraries
parentNode: web-mapping-libraries-group
difficulty: advanced
importance: important

summary: An open-source JavaScript library for creating 3D globes and 2D maps in web browsers with time-dynamic visualizations.
description: |
  CesiumJS is a JavaScript library for creating 3D globes and maps without a plugin. It uses WebGL for
  hardware-accelerated graphics, and is cross-platform, cross-browser, and optimized for dynamic data visualization.

  Supports 3D terrain, imagery, 3D Tiles for massive datasets, time-dynamic data, and various geospatial formats.
  Widely used for aerospace, defense, simulation, and geospatial visualization.

