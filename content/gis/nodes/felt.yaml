summary: A collaborative web-based mapping platform for creating, sharing, and discussing maps in real-time.
description: |
  Felt is a modern, collaborative mapping tool that makes it easy to create and share maps with teams.
  Features real-time collaboration, simple data import (drag-and-drop), annotation tools, and sharing capabilities.

  Designed for teams and non-technical users, making GIS accessible without requiring deep technical knowledge.
  Supports various data formats and provides intuitive styling and visualization options.

