summary: Oracle Database's enterprise spatial extension for storing, indexing, and analyzing geographic data.
description: |
  Oracle Spatial and Graph extends Oracle Database with advanced spatial data types,
  indexing, and analysis capabilities. Part of Oracle Database since version 8i,
  it provides enterprise-grade spatial database functionality.

  Supports 2D/3D geometries, topology, network analysis, spatial indexing (R-Tree, Quadtree),
  coordinate systems, and hundreds of spatial operators and functions. Includes GeoRaster
  for raster data. Used in large enterprise deployments requiring scalability and reliability.

