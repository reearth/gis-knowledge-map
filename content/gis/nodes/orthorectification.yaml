id: orthorectification
title: Orthorectification
aliases: [Geometric Correction, Orthophoto Processing]

type: remote-sensing
parentNode: remote-sensing-group
difficulty: advanced
importance: important

summary: Correcting imagery for geometric distortions caused by terrain, sensor tilt, and camera perspective.
description: |
  Orthorectification is the process of geometrically correcting aerial or satellite imagery
  to remove distortions caused by terrain relief, sensor orientation, and Earth curvature,
  producing an orthophoto with uniform scale suitable for measurement.

  Requires Digital Elevation Model (DEM) for terrain correction, camera calibration parameters,
  and Ground Control Points (GCPs) for georeferencing. Process removes perspective distortion,
  making imagery planimetrically correct. Essential for accurate mapping, change detection,
  and integration with GIS layers. Tools: GDAL, ENVI, Pix4D, Agisoft Metashape.

