summary: Open-source platform for publishing spatial data and interactive mapping applications using OGC standards.
description: |
  MapServer is a popular open-source platform for publishing spatial data to the web.
  Originally developed by the University of Minnesota, it's written in C for high performance
  and supports all major OGC web service standards.

  Supports WMS, WFS, WCS, WMS-T (time-enabled), SOS, and Filter Encoding. Uses mapfiles
  for configuration, supports multiple data sources (PostGIS, Shapefile, raster formats),
  and provides powerful cartographic styling. Fast, stable, and widely deployed.

