summary: Programming libraries for performing spatial analysis and geometric operations.
description: |
  Analysis libraries provide programmatic interfaces for performing spatial operations,
  geometric calculations, and GIS analysis. Unlike processing tools (which are typically CLI),
  these are code libraries used within applications. They include JavaScript libraries like
  Turf.js for client-side analysis, Python libraries like Shapely and GeoPandas for
  data science workflows, and database functions like PostGIS spatial functions.

