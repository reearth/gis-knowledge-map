id: cdn-delivery
title: CDN Delivery
aliases: [Content Delivery Network, Tile CDN, Map CDN]

type: tile-delivery-systems
parentNode: tile-delivery-systems-group
difficulty: intermediate
importance: important

summary: Content Delivery Networks for distributing map tiles globally with low latency and high availability.
description: |
  CDNs distribute map tiles across geographically dispersed edge servers, reducing latency
  by serving content from locations nearest to users. Critical for global map applications
  requiring fast, reliable tile delivery.

  Popular providers: Cloudflare, AWS CloudFront, Fastly, Azure CDN. Benefits include reduced
  origin server load, automatic failover, DDoS protection, and global scalability. Essential
  for production web mapping applications with international users.

