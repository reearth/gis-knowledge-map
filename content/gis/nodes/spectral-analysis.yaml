id: spectral-analysis
title: Spectral Analysis
aliases: [Multispectral Analysis, Band Math, Spectral Indices]

type: remote-sensing
parentNode: remote-sensing-group
difficulty: intermediate
importance: critical

summary: Analyzing electromagnetic spectrum bands to extract information about surface properties and materials.
description: |
  Spectral analysis examines how objects reflect/emit electromagnetic radiation across
  different wavelengths (bands) to identify materials, vegetation health, water quality,
  and other surface properties. Foundation of remote sensing interpretation.

  Techniques include band ratios and indices (NDVI for vegetation, NDWI for water, NDBI
  for built-up areas), spectral signatures (unique reflectance patterns), principal component
  analysis (PCA), and tasseled cap transformation. Multispectral (3-15 bands) vs hyperspectral
  (100+ bands). Essential for vegetation monitoring, geology, and environmental analysis.

