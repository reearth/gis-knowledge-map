summary: DuckDB spatial extension for high-performance analytical queries on spatial data with OLAP capabilities.
description: |
  DuckDB Spatial extends DuckDB (an analytical in-process database) with spatial data support,
  combining the performance of DuckDB's columnar storage with geospatial capabilities.
  Optimized for analytical workloads rather than transactional operations.

  Provides spatial types, functions based on GEOS, and native support for spatial file formats
  (GeoParquet, FlatGeobuf, GeoJSON, Shapefile via GDAL). Extremely fast for spatial analytics,
  aggregations, and joins on large datasets. Ideal for data science and analytical GIS workflows.

