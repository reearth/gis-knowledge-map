id: change-detection
title: Change Detection
aliases: [Temporal Analysis, Multi-temporal Analysis, Time Series Analysis]

type: remote-sensing
parentNode: remote-sensing-group
difficulty: advanced
importance: critical

summary: Identifying and analyzing changes between imagery captured at different times for monitoring environmental and urban dynamics.
description: |
  Change detection analyzes multi-temporal imagery to identify, quantify, and characterize
  changes in land cover, vegetation, urban areas, water bodies, and other features over time.
  Critical for monitoring deforestation, urban growth, disaster impacts, and environmental change.

  Methods include image differencing, ratio methods, classification comparison (post-classification
  comparison), advanced algorithms (CVA, MAD, deep learning). Requires co-registered imagery,
  atmospheric correction, and careful temporal alignment. Time-series analysis (LandTrendr, BFAST)
  detects trends and breakpoints. Google Earth Engine excels at large-scale change detection.

