id: las-laz
title: LAS/LAZ
aliases: [LAS, LAZ, LIDAR Data Format]

type: data-formats
parentNode: data-formats-group
difficulty: advanced
importance: important

summary: Industry-standard point cloud data format for LIDAR with compressed LAZ variant.
description: |
  LAS (LASer) is the industry-standard binary format for storing 3D point cloud data, particularly
  from LIDAR sensors. It stores XYZ coordinates along with attributes like intensity, return number,
  classification, RGB color, and GPS timestamps.

  LAZ is a losslessly compressed version of LAS, typically achieving 7-20x compression ratios
  while maintaining full data fidelity. LAZ files can be read directly without decompression by
  most modern tools. Both formats are widely used in surveying, forestry, urban planning,
  autonomous vehicles, and 3D city modeling.

